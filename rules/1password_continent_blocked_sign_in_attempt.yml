# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: 1Password Sign-In Blocked by Continent Restriction
description: |-
  Detect sign-in attempts to 1Password that were blocked by a continent-blocking
  policy. This may indicate an attacker attempting to access an account from a
  geographic region your organization has restricted, or an attempt to bypass
  access controls using a VPN or compromised infrastructure in a blocked region.
severity: Medium
query_text: |-
  @scnr.source_type:1password
  type:continent_blocked
  | groupbycount(target_user.email, country)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1078.valid_accounts
- source.1password
tests:
- name: Continent-blocked sign-in attempt fires
  now_timestamp: "2026-05-15T00:03:00.000Z"
  dataset_inline: |
    {"timestamp":"2026-05-15T00:02:30.000Z","@scnr.source_type":"1password","type":"continent_blocked","country":"KP","target_user":{"email":"alice@example.com"}}
  expected_detection_result: true
- name: Non-blocked sign-in attempt does not fire
  now_timestamp: "2026-05-15T00:03:00.000Z"
  dataset_inline: |
    {"timestamp":"2026-05-15T00:02:30.000Z","@scnr.source_type":"1password","type":"credentials_ok","country":"US","target_user":{"email":"alice@example.com"}}
  expected_detection_result: false
